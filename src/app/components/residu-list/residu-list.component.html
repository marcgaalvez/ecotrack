<div class="list-wrapper">

  <!-- FILTRES -->
  <div class="filters">
    <button class="filter-btn" [class.active]="filtre() === 'tots'" (click)="setFiltre('tots')">
      Tots
    </button>
    <button class="filter-btn filter-btn--pendent" [class.active]="filtre() === 'pendent'" (click)="setFiltre('pendent')">
      Pendents
    </button>
    <button class="filter-btn filter-btn--processat" [class.active]="filtre() === 'processat'" (click)="setFiltre('processat')">
      Processats
    </button>
  </div>

  <!-- LLISTA -->
  @if (residusMostrats.length === 0) {
    <div class="empty-state">
      <span class="empty-icon">📭</span>
      <p>Cap residu trobat amb aquest filtre.</p>
    </div>
  } @else {
    <div class="cards-grid">
      @for (residu of residusMostrats; track residu.id) {
        <div class="residu-card" [class.card--processat]="residu.estat === 'Processat'">

          <div class="card-top">
            <span class="badge" [class]="'badge ' + tipusClass(residu.tipus)">
              {{ residu.tipus }}
            </span>
            <span class="card-id">#{{ residu.id }}</span>
          </div>

          <h3 class="card-nom">{{ residu.nom }}</h3>

          <div class="card-meta">
            <div class="meta-item">
              <span class="meta-label">Pes</span>
              <span class="meta-val">{{ residu.pes | number:'1.1-1' }} kg</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Data</span>
              <span class="meta-val">{{ residu.data | date:'dd/MM/yy' }}</span>
            </div>
          </div>

          <div class="card-footer">
            <span class="estat-tag" [class.estat--pendent]="residu.estat === 'Pendent'" [class.estat--processat]="residu.estat === 'Processat'">
              {{ residu.estat }}
            </span>
            <div class="card-actions">
              <button class="action-btn action-btn--toggle" (click)="toggleEstat(residu.id)" [title]="residu.estat === 'Pendent' ? 'Marcar com Processat' : 'Revertir a Pendent'">
                {{ residu.estat === 'Pendent' ? '✓' : '↩' }}
              </button>
              <button class="action-btn action-btn--delete" (click)="eliminar(residu.id)" title="Eliminar">
                ✕
              </button>
            </div>
          </div>

        </div>
      }
    </div>
  }

</div>
